name: Build SquadFit Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../SquadFit.apk

      - name: Keep a copy on this run
        uses: actions/upload-artifact@v4
        with:
          name: SquadFit-apk
          path: SquadFit.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SquadFit Android v1.0.${{ github.run_number }}
          make_latest: true
          files: SquadFit.apk
          body: |
            Install on Android: download SquadFit.apk on your phone, open it, and allow "install unknown apps" if asked.
