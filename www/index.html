<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#120a1c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SquadFit</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Kaushan+Script&display=swap" />
  <link rel="stylesheet" href="styles.css?v=202611231000" />
</head>
<body>
  <div id="app"><div class="splash"><div class="splash-blur"></div><div class="splash-img"></div><div class="load"><i></i></div></div></div>
  <script>
    // Splash shows this phone's own squad picture (a new phone shows no group picture at all)
    (function () { try {
      var bg = localStorage.getItem('squadfit-splash');
      if (!bg && localStorage.getItem('squadfit-logged-in-before') === '1' && !localStorage.getItem('squadfit-squad-code')) bg = 'assets/squad-bg.jpg';
      if (bg && bg !== 'none') { var u = 'url(' + bg + ')'; document.querySelector('.splash-blur').style.backgroundImage = u; document.querySelector('.splash-img').style.backgroundImage = u; }
      else document.querySelector('.splash').classList.add('plain');
    } catch (e) { } })();
  </script>
  <div id="sheet-root"></div>
  <div id="toast"></div>
  <script src="config.js?v=202611231000"></script>
  <script type="module" src="app.js?v=202611231000"></script>
</body>
</html>
